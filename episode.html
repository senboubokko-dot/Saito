<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>話を読む | Saito</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">Saito</a>
  </div>
</header>

<main class="container" id="main-content">
  <p class="no-results is-visible">読み込み中です…</p>
</main>

<footer class="site-footer">
  <p>&copy; 2026 Saito 小説投稿サイト</p>
</footer>

<script>
  (function () {
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    var mainEl = document.getElementById('main-content');
    var params = new URLSearchParams(window.location.search);
    var novelId = params.get('id');
    var chapterNumber = parseInt(params.get('n'), 10) || 1;

    function showError(message) {
      mainEl.innerHTML = '<p class="no-results is-visible">' + escapeHtml(message) + '</p>';
    }

    if (!novelId) {
      showError('作品が指定されていません。ホームから作品を選んでください。');
      return;
    }

    fetch('/api/novels/' + encodeURIComponent(novelId))
      .then(function (res) {
        if (!res.ok) throw new Error('not found');
        return res.json();
      })
      .then(function (novel) {
        var chapter = novel.chapters.find(function (c) { return c.number === chapterNumber; });
        if (!chapter) {
          showError('指定された話が見つかりませんでした。');
          return;
        }

        var heading = '第' + chapter.number + '話　' + chapter.title;
        document.title = heading + ' | ' + novel.title + ' | Saito';

        var bodyHtml = chapter.body
          .split('\n')
          .map(function (line) { return line.trim(); })
          .filter(function (line) { return line.length > 0; })
          .map(function (line) { return '<p>' + escapeHtml(line) + '</p>'; })
          .join('');

        var hasPrev = chapterNumber > 1;
        var hasNext = chapterNumber < novel.chapters.length;
        var novelUrl = 'novel.html?id=' + encodeURIComponent(novel.id);

        mainEl.innerHTML =
          '<p class="breadcrumb">' +
            '<a href="' + novelUrl + '">' + escapeHtml(novel.title) + '</a> ＞ <span>第' + chapter.number + '話</span>' +
          '</p>' +
          '<div class="reading-tools">' +
            '<a href="' + novelUrl + '" class="toc-link">目次に戻る</a>' +
            '<div class="font-size-controls" role="group" aria-label="文字サイズ">' +
              '<span>文字サイズ:</span>' +
              '<button type="button" data-size="small">小</button>' +
              '<button type="button" data-size="medium" class="is-active">中</button>' +
              '<button type="button" data-size="large">大</button>' +
            '</div>' +
          '</div>' +
          '<h1 class="episode-title">' + escapeHtml(heading) + '</h1>' +
          '<article class="reading-body" id="reading-body">' + bodyHtml + '</article>' +
          '<nav class="reading-nav" aria-label="話の移動">' +
            (hasPrev
              ? '<a href="episode.html?id=' + encodeURIComponent(novel.id) + '&n=' + (chapterNumber - 1) + '" class="btn">← 前の話</a>'
              : '<span class="btn" aria-disabled="true">← 前の話</span>') +
            '<a href="' + novelUrl + '" class="toc-link">目次</a>' +
            (hasNext
              ? '<a href="episode.html?id=' + encodeURIComponent(novel.id) + '&n=' + (chapterNumber + 1) + '" class="btn btn-primary">次の話 →</a>'
              : '<a href="' + novelUrl + '" class="btn btn-primary">目次に戻る</a>') +
          '</nav>';

        var sizeClass = { small: 'font-small', medium: '', large: 'font-large' };
        document.querySelectorAll('.font-size-controls button').forEach(function (btn) {
          btn.addEventListener('click', function () {
            document.querySelectorAll('.font-size-controls button').forEach(function (b) { b.classList.remove('is-active'); });
            btn.classList.add('is-active');
            document.getElementById('reading-body').className = 'reading-body ' + sizeClass[btn.dataset.size];
          });
        });
      })
      .catch(function () {
        showError('作品が見つかりませんでした。');
      });
  })();
</script>

</body>
</html>
