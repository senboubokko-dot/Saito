<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>管理者ログイン | Saito</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

<div class="login-wrap">
  <div class="login-card">
    <span class="login-logo">Saito</span>
    <p class="login-title">管理者ログイン</p>

    <form class="login-form" action="write.html" method="get">
      <div class="form-group">
        <label for="admin-id">管理者ID</label>
        <input type="text" id="admin-id" name="admin-id" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="admin-password">パスワード</label>
        <input type="password" id="admin-password" name="admin-password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary">ログイン</button>
    </form>

    <a href="../index.html" class="login-back">サイトに戻る</a>
  </div>
</div>

</body>
</html>
