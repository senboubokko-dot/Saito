<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#12181c">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="description" content="Saito の会員登録ページです。会員になると作品をブックマークできます。">
<title>会員登録 | Saito</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">Saito</a>
    <nav class="reader-nav" id="reader-nav"></nav>
  </div>
</header>

<main class="container" style="max-width: 420px;">

  <h1 class="section-title">会員登録</h1>

  <form class="write-form" id="signup-form">
    <div class="form-group">
      <label for="username">ユーザー名</label>
      <input type="text" id="username" autocomplete="username" required>
    </div>

    <div class="form-group">
      <label for="email">メールアドレス（任意）</label>
      <input type="email" id="email" autocomplete="email">
    </div>

    <div class="form-group">
      <label for="password">パスワード</label>
      <input type="password" id="password" autocomplete="new-password" minlength="8" required>
      <p class="form-hint">8文字以上で入力してください。</p>
    </div>

    <div class="form-group">
      <label for="password-confirm">パスワード（確認）</label>
      <input type="password" id="password-confirm" autocomplete="new-password" minlength="8" required>
    </div>

    <p class="form-error" id="signup-error" hidden></p>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">登録する</button>
    </div>
  </form>

  <p class="form-hint" style="margin-top: 1rem; text-align: center;">
    すでに会員の方は <a href="login.html" style="color: var(--color-primary);">ログイン</a>
  </p>

</main>

<footer class="site-footer">
  <p>&copy; 2026 Saito 小説投稿サイト</p>
</footer>

<script src="js/reader-nav.js"></script>
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var next = params.get('next') || 'index.html';

    document.getElementById('signup-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var errorEl = document.getElementById('signup-error');
      errorEl.hidden = true;

      var password = document.getElementById('password').value;
      var confirm = document.getElementById('password-confirm').value;

      if (password !== confirm) {
        errorEl.textContent = 'パスワードが一致しません。';
        errorEl.hidden = false;
        return;
      }

      fetch('/api/reader/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          email: document.getElementById('email').value,
          password: password
        })
      })
        .then(function (res) {
          return res.json().then(function (data) { return { ok: res.ok, data: data }; });
        })
        .then(function (result) {
          if (!result.ok) {
            errorEl.textContent = result.data.error || '登録に失敗しました。';
            errorEl.hidden = false;
            return;
          }
          window.location.href = next;
        })
        .catch(function () {
          errorEl.textContent = 'サーバーに接続できませんでした。';
          errorEl.hidden = false;
        });
    });
  })();
</script>

</body>
</html>
