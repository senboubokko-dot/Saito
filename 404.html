<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>ページが見つかりません | Saito</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .error-section {
    text-align: center;
    padding: 3rem 1rem;
  }
  .error-code {
    font-size: 3rem;
    color: var(--color-primary);
    margin: 0 0 0.5rem;
  }
  .error-message {
    color: var(--color-text-light);
    margin: 0 0 1.5rem;
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">Saito</a>

    <p class="error-code">404</p>
    <h1 class="section-title" style="border:none; padding:0; justify-content:center;">ページが見つかりません</h1>
    <p class="error-message">お探しのページは移動または削除された可能性があります。</p>
    <a href="index.html" class="btn btn-primary">ホームに戻る</a>

<footer class="site-footer">
