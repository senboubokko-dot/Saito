<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#12181c">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="description" content="オリジナル・二次創作の小説を投稿・検索・閲覧できる小説投稿サイト Saito です。">
<title>小説投稿サイト | Saito</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">Saito</a>
    <nav class="reader-nav" id="reader-nav"></nav>
  </div>
</header>

<main class="container">

  <section class="search-section">
    <form class="search-form" role="search">
      <input type="search" placeholder="作品タイトル・作者名・タグで検索" aria-label="作品を検索">
      <button type="submit">検索</button>
    </form>

    <div class="tag-filter" id="tag-filter"></div>
  </section>

  <section class="novel-list-section">
    <h1 class="section-title">新着小説</h1>

    <ul class="novel-list" id="novel-list"></ul>

    <p class="no-results" id="no-results">読み込み中です…</p>
  </section>

</main>

<footer class="site-footer">
  <p>&copy; 2026 Saito 小説投稿サイト</p>
</footer>

<script>
  (function () {
    var searchForm = document.querySelector('.search-form');
    var searchInput = searchForm.querySelector('input[type="search"]');
    var tagFilterEl = document.getElementById('tag-filter');
    var novelListEl = document.getElementById('novel-list');
    var noResults = document.getElementById('no-results');
    var logoEl = document.querySelector('.logo');

    var novels = [];
    var settings = {};

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function formatDate(iso) {
      var d = new Date(iso);
      var pad = function (n) { return String(n).padStart(2, '0'); };
      return d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate());
    }

    function renderChips() {
      tagFilterEl.innerHTML = '';
      if (settings.showTagSearch === false || !(settings.filterTags || []).length) {
        return;
      }
      var label = document.createElement('span');
      label.className = 'tag-filter-label';
      label.textContent = 'タグで絞り込む:';
      tagFilterEl.appendChild(label);

      settings.filterTags.forEach(function (tag) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'chip';
        btn.textContent = tag;
        btn.addEventListener('click', function () {
          btn.classList.toggle('is-active');
          applyFilter();
        });
        tagFilterEl.appendChild(btn);
      });
    }

    function novelCardHtml(novel) {
      var isOriginal = novel.worktype !== 'derivative';
      var badgeClass = isOriginal ? 'badge badge-original' : 'badge';
      var badgeText = isOriginal ? 'オリジナル' : '二次創作';
      var tagsHtml = (novel.tags || []).map(function (t) {
        return '<span class="tag">' + escapeHtml(t) + '</span>';
      }).join('');

      return (
        '<a href="novel.html?id=' + encodeURIComponent(novel.id) + '" class="novel-card-link">' +
          '<div class="novel-card-top">' +
            '<h2 class="novel-title">' + escapeHtml(novel.title) + '</h2>' +
            '<span class="' + badgeClass + '">' + badgeText + '</span>' +
          '</div>' +
          '<p class="novel-author">' + escapeHtml(novel.author) + '</p>' +
          '<p class="novel-summary">' + escapeHtml(novel.note || '') + '</p>' +
          '<div class="novel-tags">' + tagsHtml + '</div>' +
          '<div class="novel-meta"><span class="updated">更新: ' + formatDate(novel.updatedAt) + '</span></div>' +
        '</a>'
      );
    }

    function renderNovels(list) {
      novelListEl.innerHTML = '';
      list.forEach(function (novel) {
        var li = document.createElement('li');
        li.className = 'novel-card';
        li.innerHTML = novelCardHtml(novel);
        novelListEl.appendChild(li);
      });
      noResults.classList.toggle('is-visible', list.length === 0);
      noResults.textContent = '該当する作品が見つかりませんでした。検索条件を変えてお試しください。';
    }

    function activeChipTags() {
      return Array.prototype.filter.call(tagFilterEl.querySelectorAll('.chip'), function (c) {
        return c.classList.contains('is-active');
      }).map(function (c) {
        return c.textContent.trim();
      });
    }

    function sortedNovels() {
      var list = novels.slice();
      if (settings.sortOrder === 'created_desc') {
        list.sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
      } else {
        // updated_desc（既定）。「人気順」は閲覧数などの指標が無いため、暫定的に更新順を使用
        list.sort(function (a, b) { return new Date(b.updatedAt) - new Date(a.updatedAt); });
      }
      return list;
    }

    function applyFilter() {
      var query = searchInput.value.trim().toLowerCase();
      var activeTags = activeChipTags();

      var filtered = sortedNovels().filter(function (novel) {
        var haystack = (novel.title + ' ' + novel.author + ' ' + (novel.tags || []).join(' ')).toLowerCase();
        var matchesQuery = !query || haystack.indexOf(query) !== -1;
        var matchesTags = activeTags.every(function (t) { return (novel.tags || []).indexOf(t) !== -1; });
        return matchesQuery && matchesTags;
      });

      var perPage = settings.perPage > 0 ? settings.perPage : filtered.length;
      renderNovels(filtered.slice(0, perPage));
    }

    searchInput.addEventListener('input', applyFilter);
    searchForm.addEventListener('submit', function (e) {
      e.preventDefault();
      applyFilter();
    });

    Promise.all([
      fetch('/api/novels').then(function (r) { return r.json(); }),
      fetch('/api/settings').then(function (r) { return r.json(); })
    ]).then(function (results) {
      novels = results[0];
      settings = results[1];
      if (settings.siteTitle) {
        logoEl.textContent = settings.siteTitle;
        document.title = settings.siteTitle + ' | 小説投稿サイト';
      }
      renderChips();
      applyFilter();
    }).catch(function () {
      noResults.textContent = '作品の読み込みに失敗しました。サーバーが起動しているかご確認ください。';
      noResults.classList.add('is-visible');
    });
  })();
</script>
<script src="js/reader-nav.js"></script>

</body>
</html>
